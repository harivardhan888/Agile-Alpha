<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile Alpha - Market Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(circle at top right, #1e3a8a 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #0f766e 0%, transparent 40%);
            background-attachment: fixed;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease-out;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px -12px var(--accent-glow);
        }

        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        input {
            flex: 1;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .status-text {
            margin-top: 1rem;
            color: var(--text-secondary);
            font-weight: 300;
            animation: pulse 1.5s infinite;
        }

        .results {
            display: none;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
        }

        .results h2 {
            margin-bottom: 1rem;
            color: #34d399;
        }

        /* Formatted markdown-like text */
        .report-content {
            line-height: 1.6;
            color: #cbd5e1;
        }
        
        .report-content h1, .report-content h2, .report-content h3 {
            color: white;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .report-content p {
            margin-bottom: 1rem;
        }

        .report-content ul {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 50% { opacity: 0.5; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="header">
        <h1>Agile Alpha</h1>
        <p>AI-Driven Market Intelligence Crew</p>
    </div>

    <div class="glass-panel">
        <div class="input-group">
            <input type="text" id="companyInput" placeholder="Company Name (e.g., Nvidia)" required>
            <input type="text" id="symbolInput" placeholder="Ticker Symbol (e.g., NVDA)" required>
        </div>
        
        <div class="input-group" style="margin-bottom: 2rem;">
            <input type="file" id="docUpload" accept=".txt,.pdf" style="padding: 0.8rem; background: rgba(15,23,42,0.4);">
            <button id="uploadBtn" onclick="uploadDocument()" style="flex: 0.4; font-size: 0.9rem; padding: 0.8rem;">Upload Doc (Optional)</button>
        </div>
        
        <button id="analyzeBtn" onclick="startResearch()" style="width: 100%;">Generate Investment Strategy</button>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="status-text" id="statusText">Orchestrating AI Agents... this may take 2-5 minutes.</div>
        </div>

        <div class="results" id="results">
            <h2>Investment Strategy</h2>
            <div class="report-content" id="reportContent"></div>
        </div>
    </div>

    <script>
        async function uploadDocument() {
            const fileInput = document.getElementById('docUpload');
            const file = fileInput.files[0];
            if (!file) return alert("Please select a file to upload (.txt or .pdf).");
            
            const btn = document.getElementById('uploadBtn');
            btn.innerText = "Uploading...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append("file", file);

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if(data.status === "success") {
                    btn.innerText = "Uploaded!";
                    btn.style.background = "#34d399";
                }
            } catch (err) {
                alert("Upload failed: " + err);
                btn.innerText = "Upload Doc (Optional)";
                btn.disabled = false;
            }
        }

        async function startResearch() {
            const company = document.getElementById('companyInput').value;
            const symbol = document.getElementById('symbolInput').value;
            const btn = document.getElementById('analyzeBtn');
            const loader = document.getElementById('loader');
            const resultsDiv = document.getElementById('results');
            
            if (!company || !symbol) return alert("Please enter both Company and Symbol");

            btn.disabled = true;
            loader.style.display = 'flex';
            resultsDiv.style.display = 'none';

            try {
                // Start Job
                const res = await fetch('/api/research', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ company, symbol })
                });
                
                const data = await res.json();
                pollStatus(data.task_id);
            } catch (err) {
                alert("Failed to start research: " + err);
                resetUI();
            }
        }

        async function pollStatus(taskId) {
            const statusText = document.getElementById('statusText');
            const pollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/status/${taskId}`);
                    const data = await res.json();

                    if (data.status === 'completed') {
                        clearInterval(pollInterval);
                        displayResults(data.result);
                    } else if (data.status === 'failed') {
                        clearInterval(pollInterval);
                        alert("Workflow failed: " + data.error);
                        resetUI();
                    } else {
                        // processing
                        statusText.innerText = "Agents are actively researching and analyzing data...";
                    }
                } catch (err) {
                    console.error("Polling error", err);
                }
            }, 5000); // Poll every 5 seconds
        }

        function displayResults(text) {
            document.getElementById('loader').style.display = 'none';
            const resultsDiv = document.getElementById('results');
            const content = document.getElementById('reportContent');
            
            // Very basic markdown parser for bold and lists to make it look nice
            let formattedText = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n- (.*?)/g, '<br>• $1')
                .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color: #60a5fa;">$1</a>');
                
            content.innerHTML = `<p>${formattedText}</p>`;
            resultsDiv.style.display = 'block';
            document.getElementById('analyzeBtn').disabled = false;
        }

        function resetUI() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('analyzeBtn').disabled = false;
        }
    </script>
</body>
</html>
